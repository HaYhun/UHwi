<title>Vocab Master | WEEK 15–21</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#182238;--muted:#778198;--line:#e7eaf1;--blue:#4568e8;--blue2:#edf1ff;--green:#15966b;--red:#d94c5b;--shadow:0 12px 35px #26365a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:1050px;margin:auto;padding:24px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{font-weight:900;letter-spacing:.08em;font-size:19px}.brand span{color:var(--blue)}.sub{font-size:12px;color:var(--muted);margin-top:4px}
.topbtn{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:12px;color:var(--ink)}
.hero{background:linear-gradient(120deg,#263b82,#526fe9);color:#fff;padding:30px;border-radius:24px;box-shadow:var(--shadow);margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:clamp(25px,5vw,36px)}.hero p{margin:0;color:#e2e8ff}
.stats{display:flex;gap:22px;margin-top:24px;flex-wrap:wrap}.stat strong{display:block;font-size:23px}.stat small{color:#d9e0ff}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:28px 2px 14px}.section-title h2{font-size:18px;margin:0}.section-title small{color:var(--muted)}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.week{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.weekhead{display:flex;justify-content:space-between;align-items:center}.week h3{margin:0;font-size:17px}.count{font-size:12px;color:var(--muted)}.bar{height:7px;background:#eef0f5;border-radius:9px;margin:15px 0 13px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);width:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{padding:11px 9px;border-radius:11px;font-weight:700;font-size:13px;background:var(--blue2);color:var(--blue)}.btn.primary{background:var(--blue);color:#fff}.btn.light{background:#f3f5f9;color:#39445b}
.finalcard{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:var(--shadow)}.finalcard h3{margin:0 0 5px}.finalcard p{margin:0;color:var(--muted);font-size:13px}
.screen{display:none}.screen.active{display:block}.back{background:transparent;color:var(--muted);padding:8px 0;margin-bottom:15px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,32px);box-shadow:var(--shadow)}
.panelhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:20px}.pill{background:var(--blue2);color:var(--blue);padding:7px 11px;border-radius:30px;font-size:12px;font-weight:800}
.flashcard{min-height:340px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.word{font-size:clamp(32px,7vw,52px);font-weight:850;letter-spacing:-.04em;margin:8px 0}.meaning{font-size:18px;color:#45516a;line-height:1.65;max-width:700px}.examples{width:100%;text-align:left;margin-top:25px;border-top:1px solid var(--line);padding-top:18px}.examples h4{margin:0 0 12px;font-size:13px;color:var(--muted)}.example{background:#f7f8fc;border-radius:12px;padding:12px 14px;margin:8px 0;line-height:1.55;font-size:14px}.example b{color:var(--blue)}.translation{color:var(--muted);font-size:13px;margin-top:3px}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}.navrow button{padding:12px 18px;border-radius:12px;background:#eef1f8;color:#27334c;font-weight:750}.navrow .primary{background:var(--blue);color:white}.progressline{height:6px;background:#edf0f6;border-radius:8px;margin:14px 0 20px}.progressline i{display:block;height:100%;background:var(--blue);border-radius:8px;width:0}
.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{padding:20px;border:1px solid var(--line);border-radius:16px;background:#fff;text-align:left}.mode strong{display:block;font-size:17px;margin-bottom:5px}.mode span{color:var(--muted);font-size:13px}
.question{font-size:clamp(24px,5vw,34px);font-weight:850;text-align:center;margin:30px 0 25px;overflow-wrap:anywhere}.qhint{text-align:center;color:var(--muted);font-size:13px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{padding:16px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left;color:var(--ink);line-height:1.4}.option:hover{border-color:var(--blue)}.option.correct{border-color:var(--green);background:#eaf8f2}.option.wrong{border-color:var(--red);background:#fff0f1}.feedback{min-height:30px;margin:15px 0;text-align:center;font-weight:750}.feedback.ok{color:var(--green)}.feedback.no{color:var(--red)}.typed-wrap{display:flex;gap:9px;max-width:560px;margin:0 auto;width:100%}.typed-input{flex:1;min-width:0;padding:15px 16px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);outline:none}.typed-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4568e81a}.typed-submit{padding:0 20px;border-radius:13px;background:var(--blue);color:#fff;font-weight:750}.typed-submit:disabled{opacity:.5;cursor:default}@media(max-width:480px){.typed-wrap{flex-direction:column}.typed-submit{padding:14px}}
.result{text-align:center;padding:24px 0}.score{font-size:54px;font-weight:900;color:var(--blue)}.result p{color:var(--muted)}.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@media(max-width:600px){.app{padding:16px 13px 45px}.hero{padding:23px;border-radius:19px}.options{grid-template-columns:1fr}.finalcard{align-items:flex-start;flex-direction:column}.modegrid{grid-template-columns:1fr 1fr}.panel{border-radius:18px}}
</style></head>

<section id="memorize" class="screen"><button class="back" onclick="goHome()">← 주차 목록으로</button><div class="panel"><div class="panelhead"><div><div class="pill" id="memWeek">WEEK 15</div><h2 style="margin:12px 0 0">단어 암기</h2></div><span id="memCount" class="count">1 / 1</span></div><div class="progressline"><i id="memBar"></i></div><div class="flashcard"><div class="pill">VOCABULARY</div><div class="word" id="memWord"></div><div class="meaning" id="memMeaning"></div><div class="examples"><h4>EXAMPLE SENTENCES</h4><div class="example" id="ex1"></div><div class="example" id="ex2"></div></div></div><div class="navrow"><button onclick="moveMem(-1)">← 이전</button><button class="light" onclick="showWordList()">단어 목록</button><button class="primary" onclick="moveMem(1)">다음 →</button></div></div></section>
<section id="list" class="screen"><button class="back" onclick="showMem()">← 암기로 돌아가기</button><div class="panel"><div class="panelhead"><h2 id="listTitle">단어 목록</h2><span class="count" id="listCount"></span></div><div id="wordList" class="weeks"></div></div></section>

<script>
const DATA = [{"week":15,"words":[{"en":"create","ko":"창조하다, 만들어 내다","examples":[{"en":"Artists create new worlds with their imagination.","ko":"예술가들은 상상력으로 새로운 세계를 창조한다."},{"en":"She wants to create a mobile app for students.","ko":"그녀는 학생들을 위한 모바일 앱을 만들고 싶어 한다."}]},{"en":"faith","ko":"1. 믿음, 신뢰 2. 신앙(심)","examples":[{"en":"I have great faith in my teammates.","ko":"나는 팀원들을 크게 믿는다."},{"en":"Her strong faith helped her through hard times.","ko":"그녀의 굳건한 신앙심은 힘든 시기를 견디게 해 주었다."}]},{"en":"discreet","ko":"1. 분별 있는 2. 신중한, 조심스러운","examples":[{"en":"He was discreet enough not to ask about her private life.","ko":"그는 그녀의 사생활을 묻지 않을 만큼 분별이 있었다."},{"en":"Please be discreet when you talk about this matter.","ko":"이 문제에 대해 이야기할 때는 신중하게 해 주세요."}]},{"en":"duration","ko":"지속, 기간","examples":[{"en":"The duration of the movie is about two hours.","ko":"그 영화의 상영 시간은 약 두 시간이다."},{"en":"Please stay seated for the duration of the flight.","ko":"비행하는 동안 내내 자리에 앉아 계십시오."}]},{"en":"rank","ko":"등급, 계급; (등급·순위를) 차지하다, 매기다","examples":[{"en":"He rose to the rank of captain.","ko":"그는 대위 계급까지 올랐다."},{"en":"Our school ranks among the best in the country.","ko":"우리 학교는 전국 최상위권에 속한다."}]},{"en":"ultimate","ko":"궁극적인, 최후의","examples":[{"en":"Our ultimate goal is to protect the environment.","ko":"우리의 궁극적인 목표는 환경을 보호하는 것이다."},{"en":"The team faced the ultimate challenge in the final match.","ko":"그 팀은 결승전에서 최후의 도전에 직면했다."}]},{"en":"accumulate","ko":"축적하다, 모으다","examples":[{"en":"Dust began to accumulate on the old shelf.","ko":"낡은 선반 위에 먼지가 쌓이기 시작했다."},{"en":"She accumulated a fortune over thirty years.","ko":"그녀는 30년에 걸쳐 재산을 모았다."}]},{"en":"encode","ko":"1. 암호로 바꾸다 2. ((컴퓨터)) 부호화하다","examples":[{"en":"The spy encoded the message before sending it.","ko":"그 스파이는 메시지를 보내기 전에 암호로 바꿨다."},{"en":"Computers encode images as numbers.","ko":"컴퓨터는 이미지를 숫자로 부호화한다."}]},{"en":"suspend","ko":"1. 잠시 중단[유예]하다 2. 매달다 3. 정직[정학]시키다","examples":[{"en":"The company suspended production because of the storm.","ko":"그 회사는 폭풍 때문에 생산을 잠시 중단했다."},{"en":"The student was suspended for cheating on the exam.","ko":"그 학생은 시험 부정행위로 정학을 당했다."}]},{"en":"interchange","ko":"1. 교환 2. 분기점; 교환하다","examples":[{"en":"The two teams agreed to interchange ideas regularly.","ko":"두 팀은 정기적으로 의견을 교환하기로 합의했다."},{"en":"Take the exit at the next highway interchange.","ko":"다음 고속도로 분기점에서 출구로 나가세요."}]},{"en":"paradigm","ko":"1. 사고[이론]의 틀 2. 모범, 전형적인 예","examples":[{"en":"Einstein's theory caused a paradigm shift in physics.","ko":"아인슈타인의 이론은 물리학의 패러다임 전환을 가져왔다."},{"en":"This case is a paradigm of good teamwork.","ko":"이 사례는 훌륭한 팀워크의 전형이다."}]},{"en":"attentive","ko":"1. 주의를 기울이는 2. 배려하는, 신경을 쓰는","examples":[{"en":"The students were attentive during the lecture.","ko":"학생들은 강의 중에 집중해서 들었다."},{"en":"The waiter was very attentive to our needs.","ko":"그 종업원은 우리의 요구에 매우 세심하게 신경 써 주었다."}]},{"en":"ceremony","ko":"의식, 식","examples":[{"en":"The graduation ceremony starts at ten.","ko":"졸업식은 10시에 시작한다."},{"en":"They held a ceremony to honor the veterans.","ko":"그들은 참전 용사들을 기리는 의식을 열었다."}]},{"en":"withhold","ko":"1. 보류하다, 유보하다 2. 억누르다","examples":[{"en":"The bank withheld the payment until it checked the documents.","ko":"은행은 서류를 확인할 때까지 지급을 보류했다."},{"en":"She couldn't withhold her tears at the news.","ko":"그녀는 그 소식에 눈물을 억누를 수 없었다."}]},{"en":"prosecute","ko":"기소하다, 공소하다","examples":[{"en":"The government decided to prosecute the company for fraud.","ko":"정부는 그 회사를 사기죄로 기소하기로 했다."},{"en":"Trespassers will be prosecuted.","ko":"무단 침입자는 기소될 것이다."}]},{"en":"manuscript","ko":"1. 원고 2. 필사본","examples":[{"en":"The author sent her manuscript to the publisher.","ko":"그 작가는 출판사에 원고를 보냈다."},{"en":"Scholars found an ancient manuscript in the cave.","ko":"학자들은 동굴에서 고대 필사본을 발견했다."}]},{"en":"beneficent","ko":"1. 자선심이 많은, 선행을 하는 2. 유익한","examples":[{"en":"The beneficent donor gave money to the hospital.","ko":"그 자선심 많은 기부자는 병원에 돈을 기부했다."},{"en":"The rain had a beneficent effect on the crops.","ko":"비는 농작물에 유익한 효과를 주었다."}]},{"en":"bond","ko":"1. 유대, 끈 2. 접착(제) 3. 채권; 1. 유대를 맺다 2. 접착시키다","examples":[{"en":"There is a strong bond between the twins.","ko":"그 쌍둥이 사이에는 강한 유대가 있다."},{"en":"This glue bonds metal to plastic.","ko":"이 접착제는 금속을 플라스틱에 접착시킨다."}]},{"en":"tame","ko":"길들이다, 다스리다; 길들여진","examples":[{"en":"It took months to tame the wild horse.","ko":"그 야생마를 길들이는 데 몇 달이 걸렸다."},{"en":"The tame rabbit ate from her hand.","ko":"그 길들여진 토끼는 그녀의 손에서 먹이를 먹었다."}]},{"en":"obscure","ko":"모호한, 이해하기 힘든; 모호하게 하다","examples":[{"en":"The meaning of the poem is obscure.","ko":"그 시의 의미는 모호하다."},{"en":"Heavy fog obscured the view of the mountains.","ko":"짙은 안개가 산의 전망을 흐릿하게 만들었다."}]},{"en":"diabetes","ko":"당뇨병","examples":[{"en":"Diabetes is a disease that affects blood sugar levels.","ko":"당뇨병은 혈당 수치에 영향을 미치는 질병이다."},{"en":"He has to watch his diet because of diabetes.","ko":"그는 당뇨병 때문에 식단을 조심해야 한다."}]},{"en":"enhance","ko":"(지위·가치 등을) 높이다, 향상시키다","examples":[{"en":"Good lighting can enhance the look of a room.","ko":"좋은 조명은 방의 분위기를 한층 돋보이게 할 수 있다."},{"en":"The program is designed to enhance students' reading skills.","ko":"그 프로그램은 학생들의 읽기 능력을 향상시키기 위해 만들어졌다."}]},{"en":"wreck","ko":"1. 난파선 2. 잔해; 망가뜨리다, 파괴하다","examples":[{"en":"Divers explored the wreck of the old ship.","ko":"잠수부들은 그 오래된 배의 난파선을 탐사했다."},{"en":"One careless mistake wrecked the whole plan.","ko":"단 한 번의 부주의한 실수가 계획 전체를 망쳐 놓았다."}]},{"en":"brochure","ko":"(안내·광고용) 소책자","examples":[{"en":"I picked up a brochure at the travel agency.","ko":"나는 여행사에서 소책자를 하나 가져왔다."},{"en":"The brochure describes all the hotel's facilities.","ko":"그 소책자에는 호텔의 모든 시설이 소개되어 있다."}]},{"en":"punctual","ko":"시간을 지키는[엄수하는]","examples":[{"en":"She is always punctual for meetings.","ko":"그녀는 회의에 항상 시간을 지킨다."},{"en":"Being punctual shows respect for others.","ko":"시간을 지키는 것은 다른 사람에 대한 존중을 보여 준다."}]},{"en":"vanish","ko":"사라지다, 없어지다","examples":[{"en":"The magician made the coin vanish.","ko":"마술사는 동전을 사라지게 만들었다."},{"en":"The pain vanished after a few days.","ko":"통증은 며칠 뒤에 사라졌다."}]},{"en":"hardship","ko":"고난, 어려움","examples":[{"en":"Her family endured great hardship during the war.","ko":"그녀의 가족은 전쟁 중에 큰 고난을 견뎌 냈다."},{"en":"He overcame economic hardship and became a doctor.","ko":"그는 경제적 어려움을 극복하고 의사가 되었다."}]},{"en":"renowned","ko":"유명한, 명성 있는","examples":[{"en":"She is a renowned scientist in the field of physics.","ko":"그녀는 물리학 분야의 저명한 과학자다."},{"en":"The city is renowned for its beautiful beaches.","ko":"그 도시는 아름다운 해변으로 유명하다."}]},{"en":"install","ko":"설치하다, 설비하다","examples":[{"en":"I need to install a new program on my laptop.","ko":"나는 노트북에 새 프로그램을 설치해야 한다."},{"en":"They installed solar panels on the roof.","ko":"그들은 지붕에 태양광 패널을 설치했다."}]},{"en":"supplement","ko":"보충(물), 추가(물); 보충하다, 추가하다","examples":[{"en":"She takes a vitamin supplement every morning.","ko":"그녀는 매일 아침 비타민 보충제를 먹는다."},{"en":"He supplements his income by teaching at night.","ko":"그는 야간에 가르치는 일로 수입을 보충한다."}]},{"en":"rapid","ko":"빠른, 신속한","examples":[{"en":"The city has seen rapid growth in recent years.","ko":"그 도시는 최근 몇 년간 빠른 성장을 보였다."},{"en":"Doctors made a rapid response to the emergency.","ko":"의사들은 응급 상황에 신속하게 대응했다."}]},{"en":"combine","ko":"1. 결합하다[시키다] 2. 갖추다, 겸비하다; 콤바인(예취와 탈곡 기능이 결합된 농기구)","examples":[{"en":"Combine the flour and sugar in a large bowl.","ko":"큰 그릇에 밀가루와 설탕을 섞어 주세요."},{"en":"The new phone combines style with performance.","ko":"그 새 휴대폰은 스타일과 성능을 겸비하고 있다."}]},{"en":"temper","ko":"1. 성질, 기질 2. 화, 노여움; 완화시키다","examples":[{"en":"He has a quick temper and gets angry easily.","ko":"그는 성질이 급해서 쉽게 화를 낸다."},{"en":"She tempered her criticism with a few kind words.","ko":"그녀는 친절한 몇 마디로 비판의 수위를 누그러뜨렸다."}]},{"en":"retire","ko":"1. 은퇴[퇴직]하다 2. 물러나다","examples":[{"en":"My father plans to retire next year.","ko":"아버지는 내년에 은퇴할 계획이시다."},{"en":"The judges retired to consider their decision.","ko":"심사위원들은 결정을 숙의하기 위해 물러났다."}]},{"en":"heritage","ko":"(국가·사회의) 유산, 전통[전승]","examples":[{"en":"The temple is part of our national heritage.","ko":"그 사찰은 우리 민족 유산의 일부이다."},{"en":"They work to preserve their cultural heritage.","ko":"그들은 자신들의 문화유산을 보존하기 위해 노력한다."}]},{"en":"heredity","ko":"유전(적 특징)","examples":[{"en":"Heredity determines the color of your eyes.","ko":"유전이 눈 색깔을 결정한다."},{"en":"Scientists study heredity to understand diseases.","ko":"과학자들은 질병을 이해하기 위해 유전을 연구한다."}]},{"en":"instinct","ko":"1. 본능 2. 타고난 소질, 직관(력)","examples":[{"en":"Birds migrate by instinct.","ko":"새들은 본능적으로 이동한다."},{"en":"Trust your instinct when you make a hard decision.","ko":"어려운 결정을 내릴 때는 직관을 믿어라."}]},{"en":"extinct","ko":"1. 멸종된, 사라진 2. 활동을 멈춘","examples":[{"en":"Dinosaurs became extinct millions of years ago.","ko":"공룡은 수백만 년 전에 멸종했다."},{"en":"The extinct volcano has not erupted for centuries.","ko":"그 사화산은 수 세기 동안 분화하지 않았다."}]}]},{"week":16,"words":[{"en":"distinct","ko":"1. 뚜렷한, 분명한 2. 뚜렷이 다른, 별개의","examples":[{"en":"There is a distinct smell of coffee in the room.","ko":"방 안에는 커피 냄새가 뚜렷하게 난다."},{"en":"These are two distinct problems that need different solutions.","ko":"이것들은 서로 다른 해결책이 필요한 별개의 두 문제다."}]},{"en":"similarity","ko":"유사(성), 닮은 점","examples":[{"en":"There is a strong similarity between the two paintings.","ko":"그 두 그림 사이에는 매우 닮은 점이 있다."},{"en":"The similarity in their voices surprised everyone.","ko":"그들의 목소리가 비슷해서 모두가 놀랐다."}]},{"en":"abolish","ko":"(법·제도 등을) 폐지하다","examples":[{"en":"Many countries have abolished the death penalty.","ko":"많은 나라가 사형 제도를 폐지했다."},{"en":"Some people want to abolish the old rule.","ko":"일부 사람들은 그 낡은 규칙을 폐지하고 싶어 한다."}]},{"en":"mimic","ko":"모방하다[흉내 내다]; 흉내쟁이","examples":[{"en":"The parrot can mimic human voices.","ko":"그 앵무새는 사람의 목소리를 흉내 낼 수 있다."},{"en":"He is a good mimic and often imitates teachers.","ko":"그는 흉내를 잘 내서 선생님들을 자주 따라 한다."}]},{"en":"errand","ko":"심부름, 잡일","examples":[{"en":"I have to run an errand for my mother.","ko":"나는 어머니의 심부름을 해야 한다."},{"en":"He spent the morning doing errands around town.","ko":"그는 오전 내내 동네에서 잡다한 볼일을 보았다."}]},{"en":"burden","ko":"짐, 부담; 짐[부담]을 지우다","examples":[{"en":"He carried a heavy burden on his back.","ko":"그는 등에 무거운 짐을 지고 있었다."},{"en":"Don't burden her with your problems.","ko":"네 문제로 그녀에게 부담을 지우지 마라."}]},{"en":"impose","ko":"1. 부과하다 2. 강요하다","examples":[{"en":"The government imposed a new tax on sugar.","ko":"정부는 설탕에 새로운 세금을 부과했다."},{"en":"Parents should not impose their opinions on their children.","ko":"부모는 자신의 의견을 자녀에게 강요해서는 안 된다."}]},{"en":"contemporary","ko":"1. 동시대의 2. 현대의, 당대의; 동년배[동시대인]","examples":[{"en":"Shakespeare and Marlowe were contemporary writers.","ko":"셰익스피어와 말로는 동시대의 작가였다."},{"en":"The museum displays contemporary art from Korea.","ko":"그 박물관은 한국의 현대 미술을 전시한다."}]},{"en":"gene","ko":"유전자","examples":[{"en":"Genes carry information passed from parents to children.","ko":"유전자는 부모에게서 자녀에게 전달되는 정보를 담고 있다."},{"en":"Scientists found the gene that causes the disease.","ko":"과학자들은 그 질병을 일으키는 유전자를 발견했다."}]},{"en":"deal","ko":"1. 다루다, 처리[대처]하다 2. 거래하다; 1. 거래 2. 대우, 취급","examples":[{"en":"She knows how to deal with difficult customers.","ko":"그녀는 까다로운 고객을 대하는 방법을 안다."},{"en":"We made a deal to share the cost equally.","ko":"우리는 비용을 똑같이 나누기로 거래를 했다."}]},{"en":"enact","ko":"1. (법을) 제정하다 2. 상연하다, 연기하다","examples":[{"en":"The parliament enacted a new law to protect children.","ko":"의회는 어린이를 보호하기 위한 새 법을 제정했다."},{"en":"The students enacted a scene from Hamlet.","ko":"학생들은 햄릿의 한 장면을 연기했다."}]},{"en":"prominent","ko":"1. 유명한, 저명한 2. 두드러진, 눈에 잘 띄는","examples":[{"en":"He is a prominent lawyer in the city.","ko":"그는 그 도시의 저명한 변호사다."},{"en":"The red sign is prominent against the white wall.","ko":"빨간 표지판은 흰 벽 때문에 눈에 확 띈다."}]},{"en":"outlook","ko":"1. 관점, 견해 2. (미래에 대한) 전망 3. 경치, 전망","examples":[{"en":"She has a positive outlook on life.","ko":"그녀는 삶에 대해 긍정적인 관점을 가지고 있다."},{"en":"The economic outlook for next year is uncertain.","ko":"내년의 경제 전망은 불확실하다."}]},{"en":"console","ko":"위로하다, 위안을 주다","examples":[{"en":"Friends tried to console her after the loss.","ko":"친구들은 그 상실 이후 그녀를 위로하려고 애썼다."},{"en":"He consoled himself with a cup of hot tea.","ko":"그는 따뜻한 차 한 잔으로 스스로를 위로했다."}]},{"en":"sustain","ko":"1. 유지[지속]하다 2. 떠받치다, 지탱하다","examples":[{"en":"It is hard to sustain this speed for long.","ko":"이 속도를 오래 유지하기는 어렵다."},{"en":"The old bridge cannot sustain heavy trucks.","ko":"그 낡은 다리는 무거운 트럭을 떠받치지 못한다."}]},{"en":"kin","ko":"친척, 친족","examples":[{"en":"He invited all his kin to the wedding.","ko":"그는 모든 친척을 결혼식에 초대했다."},{"en":"Next of kin must be notified immediately.","ko":"가장 가까운 친족에게 즉시 알려야 한다."}]},{"en":"fabulous","ko":"기막히게 좋은, 굉장한","examples":[{"en":"We had a fabulous time at the party.","ko":"우리는 파티에서 굉장한 시간을 보냈다."},{"en":"You look fabulous in that dress!","ko":"그 드레스를 입으니 정말 멋져 보여요!"}]},{"en":"rot","ko":"썩다, 부패하다","examples":[{"en":"Fruit will rot if you leave it outside.","ko":"과일은 밖에 두면 썩는다."},{"en":"The wooden fence began to rot in the rain.","ko":"나무 울타리는 비 때문에 썩기 시작했다."}]},{"en":"charge","ko":"1. 청구하다, 부담시키다 2. 비난하다, 고소하다 3. 충전하다; 1. 요금 2. 비난, 고소 3. 책임 4. 충전","examples":[{"en":"The hotel charges fifty dollars per night.","ko":"그 호텔은 하룻밤에 50달러를 청구한다."},{"en":"I need to charge my phone before we leave.","ko":"나는 떠나기 전에 휴대폰을 충전해야 한다."}]},{"en":"paralyze","ko":"1. 마비시키다 2. 무력하게 만들다","examples":[{"en":"The accident paralyzed his left leg.","ko":"그 사고로 그의 왼쪽 다리가 마비되었다."},{"en":"The snowstorm paralyzed the whole city.","ko":"그 눈보라는 도시 전체를 마비시켰다."}]},{"en":"enormous","ko":"거대한, 엄청난","examples":[{"en":"An enormous wave hit the shore.","ko":"거대한 파도가 해안을 덮쳤다."},{"en":"She felt enormous pressure before the exam.","ko":"그녀는 시험 전에 엄청난 압박감을 느꼈다."}]},{"en":"sculpture","ko":"조각(품), 조소","examples":[{"en":"The sculpture in the park is made of bronze.","ko":"공원에 있는 조각상은 청동으로 만들어졌다."},{"en":"She studies sculpture at art school.","ko":"그녀는 미술 학교에서 조소를 공부한다."}]},{"en":"urge","ko":"촉구하다; 욕구, 충동","examples":[{"en":"Doctors urge people to get more sleep.","ko":"의사들은 사람들에게 더 많이 자라고 촉구한다."},{"en":"He felt an urge to laugh during the speech.","ko":"그는 연설 도중에 웃고 싶은 충동을 느꼈다."}]},{"en":"tolerate","ko":"참다, 견디다, 용인하다","examples":[{"en":"I can't tolerate this noise any longer.","ko":"나는 이 소음을 더 이상 참을 수 없다."},{"en":"The school does not tolerate bullying.","ko":"학교는 따돌림을 용납하지 않는다."}]},{"en":"crew","ko":"1. 승무원, 선원 2. 팀, 반, 조","examples":[{"en":"The crew welcomed passengers aboard the ship.","ko":"승무원들은 승객들을 배에 맞이했다."},{"en":"A film crew was shooting in the street.","ko":"촬영팀이 거리에서 촬영하고 있었다."}]},{"en":"transparent","ko":"1. 투명한 2. 명료한, 알기 쉬운","examples":[{"en":"The glass is clear and transparent.","ko":"그 유리는 맑고 투명하다."},{"en":"The company promised to be transparent about its spending.","ko":"그 회사는 지출 내역을 투명하게 공개하겠다고 약속했다."}]},{"en":"possess","ko":"1. 소유하다 2. (자질 등을) 지니다 3. 사로잡다","examples":[{"en":"He possesses a rare collection of stamps.","ko":"그는 희귀한 우표 수집품을 소유하고 있다."},{"en":"She possesses great courage.","ko":"그녀는 대단한 용기를 지니고 있다."}]},{"en":"revenge","ko":"복수, 보복; 복수하다","examples":[{"en":"He swore revenge on those who betrayed him.","ko":"그는 자신을 배신한 이들에게 복수하겠다고 맹세했다."},{"en":"She took revenge by winning the rematch.","ko":"그녀는 재대결에서 이겨 복수했다."}]},{"en":"subordinate","ko":"1. 종속된 2. 부차적인; 부하, 하급자","examples":[{"en":"A good leader respects his subordinates.","ko":"좋은 지도자는 부하들을 존중한다."},{"en":"In this project, design is subordinate to function.","ko":"이 프로젝트에서 디자인은 기능에 종속된다."}]},{"en":"hatch","ko":"부화하다[시키다]; (배·항공기의) 출입구","examples":[{"en":"The eggs will hatch in two weeks.","ko":"그 알들은 2주 후에 부화할 것이다."},{"en":"The pilot closed the hatch before takeoff.","ko":"조종사는 이륙 전에 출입구를 닫았다."}]},{"en":"compare","ko":"1. 비교하다 2. 비유하다","examples":[{"en":"Don't compare yourself with others.","ko":"자신을 다른 사람과 비교하지 마라."},{"en":"Poets often compare life to a journey.","ko":"시인들은 흔히 인생을 여행에 비유한다."}]},{"en":"violent","ko":"1. 폭력적인, 난폭한 2. 격렬한, 맹렬한","examples":[{"en":"The film contains violent scenes.","ko":"그 영화에는 폭력적인 장면이 나온다."},{"en":"A violent storm hit the coast last night.","ko":"어젯밤 맹렬한 폭풍이 해안을 강타했다."}]},{"en":"astronomy","ko":"천문학","examples":[{"en":"He became interested in astronomy after seeing Saturn.","ko":"그는 토성을 본 뒤로 천문학에 관심을 갖게 되었다."},{"en":"The astronomy club meets every Friday night.","ko":"천문학 동아리는 매주 금요일 밤에 모인다."}]},{"en":"viewpoint","ko":"견해, 관점","examples":[{"en":"Try to see the problem from her viewpoint.","ko":"그녀의 관점에서 그 문제를 보려고 해 봐라."},{"en":"His viewpoint differs from mine.","ko":"그의 견해는 나와 다르다."}]},{"en":"lay","ko":"1. 놓다[두다] 2. (알을) 낳다","examples":[{"en":"Please lay the book on the table.","ko":"책을 탁자 위에 놓아 주세요."},{"en":"Hens lay eggs every morning.","ko":"암탉은 매일 아침 알을 낳는다."}]},{"en":"lie","ko":"1. 눕다, 누워 있다 2. 놓여 있다 3. (어떤 상태로) 있다 4. 거짓말하다; 거짓말","examples":[{"en":"He likes to lie on the sofa and read.","ko":"그는 소파에 누워서 책 읽기를 좋아한다."},{"en":"Don't lie to me; tell me the truth.","ko":"나에게 거짓말하지 말고 사실대로 말해라."}]},{"en":"stimulate","ko":"1. 자극하다 2. 흥미[관심]를 불러일으키다","examples":[{"en":"Exercise can stimulate the brain.","ko":"운동은 뇌를 자극할 수 있다."},{"en":"The teacher's story stimulated students' interest in history.","ko":"선생님의 이야기는 학생들의 역사에 대한 흥미를 불러일으켰다."}]},{"en":"simulate","ko":"1. 모의실험하다 2. ~한 체하다, 가장하다","examples":[{"en":"Scientists simulate earthquakes on computers.","ko":"과학자들은 컴퓨터로 지진을 모의실험한다."},{"en":"He simulated illness to avoid going to school.","ko":"그는 학교에 가지 않으려고 아픈 체했다."}]}]},{"week":17,"words":[{"en":"categorize","ko":"분류하다, 범주에 넣다","examples":[{"en":"Let's categorize the books by subject.","ko":"책들을 주제별로 분류하자."},{"en":"It is hard to categorize his music.","ko":"그의 음악을 하나의 범주로 분류하기는 어렵다."}]},{"en":"reproduce","ko":"1. 재생[재현]하다 2. 복제하다 3. 번식하다","examples":[{"en":"The experiment was hard to reproduce.","ko":"그 실험은 재현하기가 어려웠다."},{"en":"Rabbits reproduce very quickly.","ko":"토끼는 매우 빠르게 번식한다."}]},{"en":"blunt","ko":"1. 무딘, 뭉툭한 2. 직설적인","examples":[{"en":"The knife is too blunt to cut the meat.","ko":"그 칼은 너무 무뎌서 고기를 자를 수 없다."},{"en":"He was blunt about his opinion of the plan.","ko":"그는 그 계획에 대한 자기 의견을 직설적으로 말했다."}]},{"en":"fiber","ko":"섬유(질)","examples":[{"en":"Vegetables are rich in fiber.","ko":"채소는 섬유질이 풍부하다."},{"en":"Cotton fibers are soft and light.","ko":"면 섬유는 부드럽고 가볍다."}]},{"en":"obsess","ko":"사로잡다, 집착하게 하다","examples":[{"en":"He is obsessed with winning every game.","ko":"그는 모든 경기에서 이기는 데 사로잡혀 있다."},{"en":"Don't let small mistakes obsess you.","ko":"사소한 실수에 집착하지 마라."}]},{"en":"merchandise","ko":"상품, 물품; 판매하다","examples":[{"en":"The store sells sports merchandise.","ko":"그 가게는 스포츠 상품을 판매한다."},{"en":"The company merchandises its products through online stores.","ko":"그 회사는 온라인 상점을 통해 제품을 판매한다."}]},{"en":"commodity","ko":"상품, 물품","examples":[{"en":"Oil is an important commodity in world trade.","ko":"석유는 세계 무역에서 중요한 상품이다."},{"en":"Fresh water is becoming a valuable commodity.","ko":"깨끗한 물은 값진 상품이 되어 가고 있다."}]},{"en":"engage","ko":"1. 관여[참여]하다 2. 고용하다 3. (주의·관심을) 끌다 4. 약속하다, 약혼하다","examples":[{"en":"Many students engage in volunteer work.","ko":"많은 학생들이 봉사 활동에 참여한다."},{"en":"The company engaged a new designer last month.","ko":"그 회사는 지난달 새 디자이너를 고용했다."}]},{"en":"subsequent","ko":"1. 다음의, 그 후의 2. 잇따라 일어나는","examples":[{"en":"Subsequent events proved him right.","ko":"그 후의 사건들이 그가 옳았음을 증명했다."},{"en":"He mentioned the problem in a subsequent email.","ko":"그는 이후의 이메일에서 그 문제를 언급했다."}]},{"en":"ponder","ko":"숙고하다, 곰곰이 생각하다","examples":[{"en":"She pondered the question for a long time.","ko":"그녀는 그 질문을 오랫동안 곰곰이 생각했다."},{"en":"He sat by the window and pondered his future.","ko":"그는 창가에 앉아 자신의 미래를 숙고했다."}]},{"en":"grasp","ko":"1. 꽉 잡다 2. 이해하다, 파악하다; 1. 꽉 잡기 2. 이해, 파악","examples":[{"en":"The baby grasped my finger tightly.","ko":"아기가 내 손가락을 꽉 잡았다."},{"en":"I can't grasp the meaning of this sentence.","ko":"나는 이 문장의 의미를 파악하지 못하겠다."}]},{"en":"atom","ko":"원자","examples":[{"en":"An atom is made up of protons, neutrons, and electrons.","ko":"원자는 양성자, 중성자, 전자로 이루어져 있다."},{"en":"Water molecules contain two hydrogen atoms.","ko":"물 분자는 두 개의 수소 원자를 포함한다."}]},{"en":"glare","ko":"1. 노려보다 2. 눈부시게 빛나다; 1. 노려봄 2. 눈부신 빛","examples":[{"en":"The driver glared at the car that cut in.","ko":"운전자는 끼어든 차를 노려보았다."},{"en":"The glare of the sun made it hard to see.","ko":"햇빛의 눈부심 때문에 앞을 보기 어려웠다."}]},{"en":"intersection","ko":"교차로, 교차 지점","examples":[{"en":"Turn left at the next intersection.","ko":"다음 교차로에서 좌회전하세요."},{"en":"The intersection of art and science is fascinating.","ko":"예술과 과학이 만나는 교차 지점은 매력적이다."}]},{"en":"dissolve","ko":"1. 용해되다[시키다] 2. 끝내다 3. 해산시키다","examples":[{"en":"Sugar dissolves quickly in hot water.","ko":"설탕은 뜨거운 물에 빠르게 녹는다."},{"en":"The company decided to dissolve the committee.","ko":"그 회사는 위원회를 해산하기로 결정했다."}]},{"en":"toxic","ko":"유독한, 독성의","examples":[{"en":"Some mushrooms are toxic to humans.","ko":"어떤 버섯은 사람에게 유독하다."},{"en":"The factory released toxic gas into the air.","ko":"그 공장은 유독 가스를 대기 중으로 내보냈다."}]},{"en":"solution","ko":"1. 해결책, 해답 2. 용해 3. 용액","examples":[{"en":"We need to find a solution to this problem.","ko":"우리는 이 문제의 해결책을 찾아야 한다."},{"en":"Salt water is a solution of salt in water.","ko":"소금물은 물에 소금이 녹아 있는 용액이다."}]},{"en":"legitimate","ko":"1. 합법적인, 정당한 2. 법률(상)의","examples":[{"en":"He has a legitimate reason for being late.","ko":"그는 늦은 데 대한 정당한 이유가 있다."},{"en":"Is this a legitimate business?","ko":"이것은 합법적인 사업입니까?"}]},{"en":"pedestrian","ko":"보행자; 보행자의","examples":[{"en":"Drivers must stop for pedestrians.","ko":"운전자는 보행자를 위해 멈춰야 한다."},{"en":"The city built a pedestrian bridge over the road.","ko":"시는 도로 위에 보행자 전용 다리를 놓았다."}]},{"en":"confuse","ko":"혼동하다, 혼란스럽게 하다","examples":[{"en":"Don't confuse the two words; they have different meanings.","ko":"그 두 단어를 혼동하지 마라. 뜻이 다르다."},{"en":"The complicated map confused the tourists.","ko":"복잡한 지도는 관광객들을 혼란스럽게 했다."}]},{"en":"discourage","ko":"1. 의욕을 꺾다 2. (못 하게) 막다, 단념시키다","examples":[{"en":"Harsh criticism can discourage young artists.","ko":"가혹한 비판은 젊은 예술가들의 의욕을 꺾을 수 있다."},{"en":"The high fence discourages people from entering.","ko":"높은 울타리는 사람들이 들어오지 못하게 막는다."}]},{"en":"parental","ko":"부모의, 어버이의","examples":[{"en":"Children need parental guidance.","ko":"아이들에게는 부모의 지도가 필요하다."},{"en":"You need parental permission to join the trip.","ko":"여행에 참가하려면 부모의 허락이 필요하다."}]},{"en":"upcoming","ko":"다가오는, 곧 있을","examples":[{"en":"Are you ready for the upcoming exam?","ko":"다가오는 시험 준비는 됐니?"},{"en":"The band will announce its upcoming tour soon.","ko":"그 밴드는 곧 있을 투어를 발표할 것이다."}]},{"en":"immune","ko":"1. 면역(성)의 2. 영향을 받지 않는 3. 면제된","examples":[{"en":"Vaccines make the body immune to disease.","ko":"백신은 몸이 질병에 면역이 되게 한다."},{"en":"Politicians are not immune to public opinion.","ko":"정치인들도 여론의 영향을 받지 않을 수 없다."}]},{"en":"scrap","ko":"1. 조각 2. 조금 3. 찌꺼기, 폐품; 폐기하다","examples":[{"en":"He wrote the number on a scrap of paper.","ko":"그는 종잇조각에 번호를 적었다."},{"en":"The factory scrapped the old machines.","ko":"그 공장은 낡은 기계들을 폐기했다."}]},{"en":"arrange","ko":"1. 정리하다, 배열하다 2. 준비[주선]하다 3. 편곡하다","examples":[{"en":"She arranged the flowers in a vase.","ko":"그녀는 꽃을 꽃병에 정리해 꽂았다."},{"en":"I'll arrange a meeting with the manager.","ko":"내가 매니저와의 회의를 준비해 두겠다."}]},{"en":"democracy","ko":"1. 민주주의 2. 민주 국가","examples":[{"en":"Korea is a democracy with free elections.","ko":"한국은 자유 선거를 하는 민주 국가다."},{"en":"Democracy depends on citizens voting.","ko":"민주주의는 시민들의 투표에 달려 있다."}]},{"en":"exert","ko":"1. (압력·영향력을) 가하다, 행사하다 2. (힘 등을) 쓰다, 발휘하다","examples":[{"en":"The moon exerts a pull on the oceans.","ko":"달은 바다에 인력을 가한다."},{"en":"He exerted all his strength to open the door.","ko":"그는 문을 열기 위해 온 힘을 쏟았다."}]},{"en":"habitat","ko":"서식지, 거주지","examples":[{"en":"The forest is the habitat of many birds.","ko":"그 숲은 많은 새들의 서식지이다."},{"en":"Pollution is destroying the natural habitat of fish.","ko":"오염은 물고기의 자연 서식지를 파괴하고 있다."}]},{"en":"enthusiasm","ko":"1. 열정, 열의 2. 열광","examples":[{"en":"She showed great enthusiasm for the project.","ko":"그녀는 그 프로젝트에 대해 큰 열정을 보였다."},{"en":"The crowd cheered with enthusiasm.","ko":"관중은 열광하며 환호했다."}]},{"en":"strive","ko":"1. 노력하다, 애쓰다 2. 싸우다, 분투하다","examples":[{"en":"We strive to improve our service every day.","ko":"우리는 매일 서비스를 개선하려고 노력한다."},{"en":"He strove against many difficulties to reach his goal.","ko":"그는 목표에 이르기 위해 많은 어려움과 맞서 분투했다."}]},{"en":"dense","ko":"1. 빽빽한, 밀집한 2. (안개 등이) 짙은","examples":[{"en":"A dense forest covered the hills.","ko":"빽빽한 숲이 언덕을 뒤덮고 있었다."},{"en":"Dense fog delayed all the flights.","ko":"짙은 안개로 모든 항공편이 지연되었다."}]},{"en":"variety","ko":"다양(성)","examples":[{"en":"The cafeteria offers a variety of dishes.","ko":"그 구내식당은 다양한 요리를 제공한다."},{"en":"Variety makes life more interesting.","ko":"다양성은 삶을 더 흥미롭게 만든다."}]},{"en":"scroll","ko":"두루마리; ((컴퓨터)) 스크롤하다(화면의 내용을 상하[좌우]로 움직이다)","examples":[{"en":"The archaeologists found an ancient scroll.","ko":"고고학자들은 고대의 두루마리를 발견했다."},{"en":"Scroll down to see the next page.","ko":"다음 페이지를 보려면 아래로 스크롤하세요."}]},{"en":"precious","ko":"1. 귀중한, 값비싼 2. 소중한","examples":[{"en":"Gold and silver are precious metals.","ko":"금과 은은 귀중한 금속이다."},{"en":"This ring is precious to me.","ko":"이 반지는 나에게 소중하다."}]},{"en":"previous","ko":"앞의, 이전의","examples":[{"en":"Please check the previous page.","ko":"이전 페이지를 확인해 주세요."},{"en":"She had no previous experience in teaching.","ko":"그녀는 가르쳐 본 이전 경험이 없었다."}]},{"en":"insult","ko":"모욕; 모욕하다","examples":[{"en":"His rude words were an insult to her.","ko":"그의 무례한 말은 그녀에 대한 모욕이었다."},{"en":"Don't insult people because of their appearance.","ko":"외모 때문에 사람들을 모욕하지 마라."}]},{"en":"insert","ko":"삽입하다, 끼워 넣다","examples":[{"en":"Insert the card into the machine.","ko":"카드를 기계에 삽입하세요."},{"en":"She inserted a new paragraph into the essay.","ko":"그녀는 에세이에 새 문단을 끼워 넣었다."}]}]},{"week":18,"words":[{"en":"condemn","ko":"1. 비난하다 2. 형을 선고하다","examples":[{"en":"The leaders condemned the violence.","ko":"지도자들은 그 폭력을 비난했다."},{"en":"The court condemned him to ten years in prison.","ko":"법원은 그에게 징역 10년을 선고했다."}]},{"en":"authentic","ko":"1. 진짜[진품]의 2. 믿을 만한, 확실한","examples":[{"en":"This is an authentic Italian pizza.","ko":"이것은 진짜 이탈리아식 피자다."},{"en":"We need authentic information from reliable sources.","ko":"우리는 믿을 만한 출처에서 나온 확실한 정보가 필요하다."}]},{"en":"impact","ko":"영향, 충격; 영향[충격]을 주다","examples":[{"en":"The new law had a big impact on small shops.","ko":"새 법은 작은 가게들에 큰 영향을 미쳤다."},{"en":"Social media can impact how teenagers think.","ko":"소셜 미디어는 십 대들의 사고방식에 영향을 줄 수 있다."}]},{"en":"magnify","ko":"1. 확대하다 2. 과장하다","examples":[{"en":"A microscope magnifies small objects.","ko":"현미경은 작은 물체를 확대한다."},{"en":"The media tends to magnify minor problems.","ko":"언론은 사소한 문제를 과장하는 경향이 있다."}]},{"en":"paradox","ko":"역설, 모순, 패러독스","examples":[{"en":"It is a paradox that the more we connect, the lonelier we feel.","ko":"우리가 더 많이 연결될수록 더 외로워진다는 것은 역설이다."},{"en":"The sentence \"I always lie\" is a famous paradox.","ko":"'나는 항상 거짓말을 한다'라는 문장은 유명한 역설이다."}]},{"en":"widespread","ko":"널리 퍼진, 광범위한","examples":[{"en":"The disease became widespread across the region.","ko":"그 질병은 지역 전체에 널리 퍼졌다."},{"en":"There is widespread support for the new policy.","ko":"새 정책에 대한 지지가 광범위하다."}]},{"en":"amend","ko":"(법 등을) 개정[수정]하다","examples":[{"en":"Congress voted to amend the law.","ko":"의회는 그 법을 개정하기로 표결했다."},{"en":"We need to amend the plan to fit the budget.","ko":"우리는 예산에 맞게 계획을 수정해야 한다."}]},{"en":"ecology","ko":"생태(계), 생태학","examples":[{"en":"She studies the ecology of wetlands.","ko":"그녀는 습지의 생태를 연구한다."},{"en":"Pollution harms the ecology of the river.","ko":"오염은 그 강의 생태계에 해를 끼친다."}]},{"en":"perceive","ko":"1. 인지[인식]하다 2. (~로) 여기다","examples":[{"en":"Dogs perceive sounds that humans cannot hear.","ko":"개는 사람이 들을 수 없는 소리를 인지한다."},{"en":"Many people perceive him as shy.","ko":"많은 사람들이 그를 수줍음이 많은 사람으로 여긴다."}]},{"en":"factual","ko":"사실의, 사실에 근거한","examples":[{"en":"The report contains several factual errors.","ko":"그 보고서에는 몇 가지 사실 오류가 있다."},{"en":"Please give a factual account of what happened.","ko":"무슨 일이 있었는지 사실에 근거해 설명해 주세요."}]},{"en":"patron","ko":"1. 후원자 2. 단골손님, 고객","examples":[{"en":"The museum thanked its generous patrons.","ko":"박물관은 후한 후원자들에게 감사를 표했다."},{"en":"The café's regular patrons love its coffee.","ko":"그 카페의 단골손님들은 커피를 아주 좋아한다."}]},{"en":"deficit","ko":"1. 적자 2. 부족(액), 결손","examples":[{"en":"The company reported a large budget deficit.","ko":"그 회사는 큰 예산 적자를 보고했다."},{"en":"A water deficit hurt the farmers this year.","ko":"올해는 물 부족이 농민들에게 피해를 주었다."}]},{"en":"civil","ko":"시민[민간]의","examples":[{"en":"Every citizen has civil rights under the law.","ko":"모든 시민은 법 아래 시민의 권리를 가진다."},{"en":"The airport serves both civil and military flights.","ko":"그 공항은 민간 항공편과 군용 항공편을 모두 취급한다."}]},{"en":"nutrition","ko":"영양, 영양 섭취","examples":[{"en":"Good nutrition is important for growing children.","ko":"좋은 영양 섭취는 성장기 아이들에게 중요하다."},{"en":"She studies nutrition at university.","ko":"그녀는 대학에서 영양학을 공부한다."}]},{"en":"intervene","ko":"1. 개입하다 2. 끼어들다, 가로막다","examples":[{"en":"The teacher intervened to stop the fight.","ko":"선생님이 싸움을 말리기 위해 개입했다."},{"en":"Please don't intervene while I'm speaking.","ko":"내가 말하는 동안 끼어들지 마세요."}]},{"en":"resolve","ko":"1. 해결하다 2. 결심[결의]하다; 결심, 결의","examples":[{"en":"They resolved the conflict peacefully.","ko":"그들은 갈등을 평화롭게 해결했다."},{"en":"She resolved to study harder this year.","ko":"그녀는 올해 더 열심히 공부하기로 결심했다."}]},{"en":"identify","ko":"1. 확인하다 2. 식별하다 3. 동일시하다","examples":[{"en":"Can you identify the man in the photo?","ko":"사진 속 남자가 누구인지 확인할 수 있나요?"},{"en":"Doctors identified the cause of the disease.","ko":"의사들은 그 질병의 원인을 식별해 냈다."}]},{"en":"discharge","ko":"1. 방출[배출]하다 2. 퇴원[제대/석방]시키다; 1. 방출[배출] 2. 퇴원, 제대","examples":[{"en":"The factory discharges waste into the river.","ko":"그 공장은 폐수를 강으로 방출한다."},{"en":"He was discharged from the hospital yesterday.","ko":"그는 어제 퇴원했다."}]},{"en":"gravity","ko":"1. 중력 2. 중대성[심각성]","examples":[{"en":"Gravity pulls objects toward the Earth.","ko":"중력은 물체를 지구 쪽으로 끌어당긴다."},{"en":"They didn't realize the gravity of the situation.","ko":"그들은 상황의 심각성을 깨닫지 못했다."}]},{"en":"partial","ko":"1. 부분적인 2. 편파적인, 불공평한","examples":[{"en":"The plan was only a partial success.","ko":"그 계획은 부분적인 성공에 불과했다."},{"en":"The referee was partial to the home team.","ko":"심판은 홈팀에 편파적이었다."}]},{"en":"boundary","ko":"1. 경계(선) 2. 한계, 한도","examples":[{"en":"A fence marks the boundary of the garden.","ko":"울타리가 정원의 경계를 나타낸다."},{"en":"Scientists keep pushing the boundaries of knowledge.","ko":"과학자들은 지식의 한계를 계속 넓혀 간다."}]},{"en":"guarantee","ko":"보장[보증]하다; 보장[보증], 보증서","examples":[{"en":"The shop guarantees the quality of its products.","ko":"그 가게는 제품의 품질을 보증한다."},{"en":"This watch comes with a two-year guarantee.","ko":"이 시계는 2년 보증서가 딸려 있다."}]},{"en":"subtle","ko":"미묘한, 감지하기 힘든","examples":[{"en":"There is a subtle difference between the two colors.","ko":"두 색 사이에는 미묘한 차이가 있다."},{"en":"Her smile showed a subtle sadness.","ko":"그녀의 미소에는 감지하기 힘든 슬픔이 배어 있었다."}]},{"en":"shed","ko":"1. 흘리다 2. (잎·껍질 등이) 떨어지다 3. 발산하다; 창고, 헛간","examples":[{"en":"Trees shed their leaves in autumn.","ko":"나무는 가을에 잎을 떨군다."},{"en":"He kept his tools in a shed behind the house.","ko":"그는 집 뒤 창고에 연장들을 두었다."}]},{"en":"tissue","ko":"1. 조직 2. 화장지 3. 얇은 종이","examples":[{"en":"Muscles are made of soft tissue.","ko":"근육은 연조직으로 이루어져 있다."},{"en":"Can I have a tissue? I have a cold.","ko":"화장지 좀 주실래요? 감기에 걸렸어요."}]},{"en":"vibrate","ko":"떨다, 진동하다, 흔들리다","examples":[{"en":"My phone vibrates when a message arrives.","ko":"내 휴대폰은 메시지가 오면 진동한다."},{"en":"The windows vibrated when the truck passed.","ko":"트럭이 지나가자 창문이 흔들렸다."}]},{"en":"outdated","ko":"구식의, 시대에 뒤진","examples":[{"en":"This textbook is outdated.","ko":"이 교과서는 시대에 뒤떨어졌다."},{"en":"Outdated rules should be changed.","ko":"구식 규칙은 바뀌어야 한다."}]},{"en":"cause","ko":"초래하다, 야기하다; 1. 원인, 이유 2. 명분","examples":[{"en":"Smoking can cause lung cancer.","ko":"흡연은 폐암을 초래할 수 있다."},{"en":"The cause of the fire is still unknown.","ko":"화재의 원인은 아직 밝혀지지 않았다."}]},{"en":"deprive","ko":"빼앗다, 박탈하다","examples":[{"en":"The storm deprived the village of electricity.","ko":"폭풍은 그 마을에서 전기를 빼앗아 갔다."},{"en":"No one should be deprived of basic human rights.","ko":"누구도 기본적인 인권을 박탈당해서는 안 된다."}]},{"en":"commerce","ko":"상업, 무역","examples":[{"en":"Online shopping has changed commerce.","ko":"온라인 쇼핑은 상업을 변화시켰다."},{"en":"The city grew rich through trade and commerce.","ko":"그 도시는 무역과 상업을 통해 부유해졌다."}]},{"en":"avoid","ko":"1. 피하다 2. 막다","examples":[{"en":"I try to avoid junk food.","ko":"나는 정크푸드를 피하려고 한다."},{"en":"Wearing a helmet can avoid serious injury.","ko":"헬멧을 쓰면 심각한 부상을 막을 수 있다."}]},{"en":"universal","ko":"1. 보편적인, 일반적인 2. 전 세계적인, 전 우주의","examples":[{"en":"Music is a universal language.","ko":"음악은 보편적인 언어다."},{"en":"Education should be a universal right.","ko":"교육은 모든 사람의 보편적인 권리여야 한다."}]},{"en":"render","ko":"1. ~하게 만들다 2. 주다, 제공하다 3. 표현하다, 연기[연주]하다","examples":[{"en":"The news rendered him speechless.","ko":"그 소식은 그를 말문이 막히게 했다."},{"en":"The company renders services to small businesses.","ko":"그 회사는 소규모 업체들에 서비스를 제공한다."}]},{"en":"sibling","ko":"(한 명의) 형제자매","examples":[{"en":"I have no siblings; I'm an only child.","ko":"나는 형제자매가 없다. 외동이다."},{"en":"Sibling rivalry is common in families.","ko":"형제자매 간의 경쟁은 가정에서 흔하다."}]},{"en":"submit","ko":"1. 제출하다 2. 굴복[항복]하다","examples":[{"en":"Submit your report by Friday.","ko":"보고서를 금요일까지 제출하세요."},{"en":"The rebels finally submitted to the government.","ko":"반란군은 마침내 정부에 굴복했다."}]},{"en":"summit","ko":"1. 꼭대기, 정상 2. 정점, 절정 3. 정상 회담","examples":[{"en":"They reached the summit at dawn.","ko":"그들은 새벽에 정상에 도착했다."},{"en":"The leaders will meet at a summit next week.","ko":"지도자들은 다음 주 정상 회담에서 만날 것이다."}]},{"en":"elect","ko":"(투표로) 선출하다; 당선된","examples":[{"en":"The students elected a new class president.","ko":"학생들은 새 반장을 선출했다."},{"en":"The president-elect will take office in January.","ko":"당선된 대통령은 1월에 취임할 것이다."}]},{"en":"erect","ko":"똑바로 선, 일어선; 세우다, 건립하다","examples":[{"en":"He stood erect with his head high.","ko":"그는 고개를 들고 똑바로 섰다."},{"en":"They plan to erect a statue in the square.","ko":"그들은 광장에 동상을 세울 계획이다."}]}]},{"week":19,"words":[{"en":"soak","ko":"담그다, (흠뻑) 적시다","examples":[{"en":"Soak the beans in water overnight.","ko":"콩을 하룻밤 동안 물에 담가 두세요."},{"en":"I got soaked in the sudden rain.","ko":"나는 갑작스러운 비에 흠뻑 젖었다."}]},{"en":"crude","ko":"1. 가공[정제]하지 않은 2. 조잡한, 거친","examples":[{"en":"Crude oil is refined into gasoline.","ko":"원유는 정제되어 휘발유가 된다."},{"en":"He drew a crude map on the sand.","ko":"그는 모래 위에 조잡한 지도를 그렸다."}]},{"en":"breakthrough","ko":"돌파구, 타개(책)","examples":[{"en":"Scientists made a breakthrough in cancer research.","ko":"과학자들은 암 연구에서 돌파구를 마련했다."},{"en":"The talks ended without a breakthrough.","ko":"그 회담은 타개책 없이 끝났다."}]},{"en":"reverse","ko":"뒤바꾸다; 반대, 역; 반대[역]의","examples":[{"en":"Reverse the order of the list.","ko":"목록의 순서를 뒤바꿔라."},{"en":"The result was the reverse of what we expected.","ko":"결과는 우리가 예상한 것과 정반대였다."}]},{"en":"phase","ko":"1. 단계[시기/국면] 2. 양상","examples":[{"en":"The project is entering its final phase.","ko":"그 프로젝트는 마지막 단계로 접어들고 있다."},{"en":"Teenagers often go through a difficult phase.","ko":"십 대들은 종종 힘든 시기를 겪는다."}]},{"en":"incentive","ko":"자극, 동기, 장려(금); 자극적인, 격려하는","examples":[{"en":"The bonus is an incentive to work harder.","ko":"보너스는 더 열심히 일하게 하는 동기다."},{"en":"Tax incentives encourage companies to hire more workers.","ko":"세금 혜택은 기업이 더 많은 직원을 고용하도록 장려한다."}]},{"en":"animate","ko":"1. 생기를 불어넣다 2. 만화 영화로 제작하다; 살아 있는, 생물인","examples":[{"en":"Her smile animated her whole face.","ko":"그녀의 미소가 얼굴 전체에 생기를 불어넣었다."},{"en":"The studio will animate the popular comic book.","ko":"그 스튜디오는 인기 만화책을 만화 영화로 제작할 것이다."}]},{"en":"comply","ko":"(규칙 등에) 따르다, 준수하다","examples":[{"en":"All drivers must comply with traffic rules.","ko":"모든 운전자는 교통 법규를 준수해야 한다."},{"en":"The factory failed to comply with safety standards.","ko":"그 공장은 안전 기준을 따르지 못했다."}]},{"en":"disaster","ko":"재앙, 재난, 재해","examples":[{"en":"The flood was a terrible disaster for the town.","ko":"그 홍수는 마을에 끔찍한 재난이었다."},{"en":"Emergency teams arrived quickly at the disaster area.","ko":"구조대는 재난 지역에 빠르게 도착했다."}]},{"en":"advent","ko":"출현, 도래","examples":[{"en":"The advent of smartphones changed daily life.","ko":"스마트폰의 출현은 일상을 바꿔 놓았다."},{"en":"The advent of spring brought warmer weather.","ko":"봄의 도래와 함께 날씨가 따뜻해졌다."}]},{"en":"inherent","ko":"내재적인, 타고난, 고유의","examples":[{"en":"Risk is inherent in any investment.","ko":"위험은 모든 투자에 내재되어 있다."},{"en":"She has an inherent talent for music.","ko":"그녀는 음악에 타고난 재능이 있다."}]},{"en":"disconnect","ko":"1. 연결[접속]을 끊다 2. 관계를 끊다","examples":[{"en":"Please disconnect the charger from the outlet.","ko":"충전기를 콘센트에서 분리해 주세요."},{"en":"He disconnected from his friends after moving away.","ko":"그는 이사 간 뒤 친구들과 관계가 끊겼다."}]},{"en":"withdraw","ko":"1. 물러나다, 철수하다 2. 철회하다 3. (예금 등을) 인출하다","examples":[{"en":"The army began to withdraw from the city.","ko":"군대는 도시에서 철수하기 시작했다."},{"en":"I need to withdraw some money from the bank.","ko":"나는 은행에서 돈을 좀 인출해야 한다."}]},{"en":"loan","ko":"대출(금), 융자; 대출하다, 빌려주다","examples":[{"en":"He took out a loan to buy a house.","ko":"그는 집을 사기 위해 대출을 받았다."},{"en":"The bank loaned her money to start a business.","ko":"은행은 그녀에게 사업을 시작할 돈을 빌려주었다."}]},{"en":"characteristic","ko":"특징, 특색; 특유의, 특징적인","examples":[{"en":"Honesty is her most notable characteristic.","ko":"정직함은 그녀의 가장 두드러진 특징이다."},{"en":"The dish has a characteristic smell of garlic.","ko":"그 요리는 마늘 특유의 냄새가 난다."}]},{"en":"harsh","ko":"가혹한, 혹독한, 거친","examples":[{"en":"The harsh winter killed many animals.","ko":"혹독한 겨울이 많은 동물을 죽였다."},{"en":"His harsh words hurt her feelings.","ko":"그의 거친 말은 그녀의 마음에 상처를 주었다."}]},{"en":"perish","ko":"죽다, 소멸하다, 사라지다","examples":[{"en":"Many plants perished in the drought.","ko":"많은 식물이 가뭄에 말라 죽었다."},{"en":"Thousands perished in the earthquake.","ko":"수천 명이 지진으로 목숨을 잃었다."}]},{"en":"describe","ko":"서술하다, 묘사하다","examples":[{"en":"Can you describe the thief's face?","ko":"도둑의 얼굴을 묘사해 줄 수 있나요?"},{"en":"The book describes life in ancient Egypt.","ko":"그 책은 고대 이집트의 생활을 서술한다."}]},{"en":"microscope","ko":"현미경","examples":[{"en":"Bacteria can only be seen under a microscope.","ko":"세균은 현미경으로만 볼 수 있다."},{"en":"She looked at the cells through a microscope.","ko":"그녀는 현미경으로 세포를 관찰했다."}]},{"en":"nominate","ko":"지명하다, 임명하다","examples":[{"en":"The committee nominated her for the award.","ko":"위원회는 그녀를 그 상의 후보로 지명했다."},{"en":"He was nominated as the new team captain.","ko":"그는 새 주장으로 지명되었다."}]},{"en":"adequate","ko":"적절한, 충분한","examples":[{"en":"Do we have adequate food for everyone?","ko":"우리에게 모두를 위한 충분한 음식이 있나요?"},{"en":"His salary is adequate to support a family.","ko":"그의 월급은 가족을 부양하기에 충분하다."}]},{"en":"resist","ko":"1. 저항하다, 반대하다 2. 참다, 견디다","examples":[{"en":"Citizens resisted the new tax.","ko":"시민들은 새 세금에 저항했다."},{"en":"He couldn't resist the chocolate cake.","ko":"그는 초콜릿 케이크를 참을 수 없었다."}]},{"en":"justice","ko":"1. 정의, 공정, 정당성 2. 사법, 재판(관)","examples":[{"en":"The people demanded justice for the victims.","ko":"사람들은 피해자들을 위한 정의를 요구했다."},{"en":"Everyone should have equal access to justice.","ko":"모든 사람은 사법 제도를 평등하게 이용할 수 있어야 한다."}]},{"en":"convert","ko":"1. 전환시키다, 개조하다 2. 개종하다","examples":[{"en":"We converted the garage into a studio.","ko":"우리는 차고를 작업실로 개조했다."},{"en":"He converted to Buddhism last year.","ko":"그는 작년에 불교로 개종했다."}]},{"en":"synthetic","ko":"1. 합성한 2. 인조의 3. 종합의","examples":[{"en":"Nylon is a synthetic fiber.","ko":"나일론은 합성 섬유다."},{"en":"The jacket is made of synthetic leather.","ko":"그 재킷은 인조 가죽으로 만들어졌다."}]},{"en":"remedy","ko":"1. 치료(약) 2. 해결책; 치료하다, 고치다","examples":[{"en":"Honey is a popular remedy for a sore throat.","ko":"꿀은 목 아플 때 인기 있는 치료법이다."},{"en":"There is no easy remedy for the housing problem.","ko":"주택 문제에는 쉬운 해결책이 없다."}]},{"en":"flush","ko":"1. 붉어지다, 상기되다 2. (변기의) 물을 내리다; 1. 홍조 2. (변기의) 물을 내림","examples":[{"en":"Her face flushed with embarrassment.","ko":"그녀의 얼굴이 창피해서 붉어졌다."},{"en":"Please flush the toilet after use.","ko":"사용 후에는 변기 물을 내려 주세요."}]},{"en":"ground","ko":"1. 지면, 땅, 토양 2. (특정 용도를 위한) 장소, -장(場) 3. 근거, 이유 4. 입장, 의견; (~에) 근거[기초]를 두다","examples":[{"en":"The children sat on the ground.","ko":"아이들은 땅바닥에 앉았다."},{"en":"On what grounds did they reject the plan?","ko":"그들은 어떤 근거로 그 계획을 거부했나?"}]},{"en":"encourage","ko":"1. 격려하다, 용기를 북돋우다 2. 장려하다","examples":[{"en":"Her parents always encouraged her to try new things.","ko":"그녀의 부모님은 항상 새로운 것에 도전하라고 격려해 주셨다."},{"en":"The city encourages people to use public transportation.","ko":"그 도시는 대중교통 이용을 장려한다."}]},{"en":"destination","ko":"1. 목적[행선]지, 도착지 2. 목적, 용도","examples":[{"en":"Our final destination is Busan.","ko":"우리의 최종 목적지는 부산이다."},{"en":"Jeju is a popular tourist destination.","ko":"제주는 인기 있는 관광 목적지이다."}]},{"en":"underestimate","ko":"1. 과소평가하다 2. 낮게[적게] 어림하다; 과소평가","examples":[{"en":"Don't underestimate your opponent.","ko":"상대를 과소평가하지 마라."},{"en":"They underestimated the cost of the project.","ko":"그들은 프로젝트의 비용을 적게 어림했다."}]},{"en":"tangible","ko":"1. 만져서 알 수 있는, 실체적인 2. 명백한","examples":[{"en":"There is no tangible proof of his guilt.","ko":"그의 유죄에 대한 명백한 증거는 없다."},{"en":"The results are tangible benefits for the community.","ko":"그 결과는 지역 사회에 실질적인 이익이다."}]},{"en":"slogan","ko":"구호, 슬로건","examples":[{"en":"The campaign's slogan was easy to remember.","ko":"그 캠페인의 구호는 기억하기 쉬웠다."},{"en":"The company changed its advertising slogan.","ko":"그 회사는 광고 슬로건을 바꿨다."}]},{"en":"volcano","ko":"화산","examples":[{"en":"The volcano erupted without warning.","ko":"그 화산은 경고 없이 분화했다."},{"en":"Hawaii has several active volcanoes.","ko":"하와이에는 여러 활화산이 있다."}]},{"en":"memorable","ko":"기억할 만한, 인상적인","examples":[{"en":"It was a memorable trip for all of us.","ko":"그것은 우리 모두에게 기억에 남는 여행이었다."},{"en":"Her speech was short but memorable.","ko":"그녀의 연설은 짧았지만 인상적이었다."}]},{"en":"memorial","ko":"기념비[물]; 기념하기 위한, 추모의","examples":[{"en":"They built a memorial for the soldiers.","ko":"그들은 군인들을 위한 기념비를 세웠다."},{"en":"A memorial service was held for the victims.","ko":"희생자들을 위한 추모식이 열렸다."}]},{"en":"preserve","ko":"1. 보존하다, 지키다 2. 저장하다","examples":[{"en":"We must preserve the forest for future generations.","ko":"우리는 미래 세대를 위해 숲을 보존해야 한다."},{"en":"Salt helps preserve meat for a long time.","ko":"소금은 고기를 오래 저장하는 데 도움이 된다."}]},{"en":"persevere","ko":"인내하며 계속하다","examples":[{"en":"She persevered despite many failures.","ko":"그녀는 여러 번의 실패에도 불구하고 인내하며 계속했다."},{"en":"If you persevere, you will succeed.","ko":"인내하며 계속하면 성공할 것이다."}]}]},{"week":20,"words":[{"en":"attain","ko":"1. 얻다, 달성하다 2. 도달하다","examples":[{"en":"She attained her goal after years of effort.","ko":"그녀는 수년간의 노력 끝에 목표를 달성했다."},{"en":"The climbers attained the top of the mountain.","ko":"등반가들은 산 정상에 도달했다."}]},{"en":"garment","ko":"옷, 의류","examples":[{"en":"She sewed a garment from silk.","ko":"그녀는 비단으로 옷 한 벌을 지었다."},{"en":"The factory produces garments for export.","ko":"그 공장은 수출용 의류를 생산한다."}]},{"en":"impersonal","ko":"1. 인간미 없는 2. 비개인적인","examples":[{"en":"The email sounded cold and impersonal.","ko":"그 이메일은 차갑고 인간미 없게 들렸다."},{"en":"It was an impersonal decision, not aimed at anyone.","ko":"그것은 누구를 겨냥한 것이 아닌 비개인적인 결정이었다."}]},{"en":"depict","ko":"1. 묘사하다 2. 그리다","examples":[{"en":"The painting depicts a village in winter.","ko":"그 그림은 겨울의 한 마을을 묘사한다."},{"en":"The film depicts the life of a young soldier.","ko":"그 영화는 한 젊은 군인의 삶을 그린다."}]},{"en":"fade","ko":"1. 바래다[희미해지다] 2. 서서히 사라지다","examples":[{"en":"The colors of the shirt faded after washing.","ko":"셔츠의 색이 세탁 후에 바랬다."},{"en":"The sound faded away slowly.","ko":"소리가 서서히 사라졌다."}]},{"en":"elastic","ko":"1. 탄성의, 신축성이 있는 2. 고무로 된","examples":[{"en":"Rubber bands are elastic.","ko":"고무줄은 탄성이 있다."},{"en":"The pants have an elastic waistband.","ko":"그 바지는 고무로 된 허리 밴드가 있다."}]},{"en":"candidate","ko":"1. 후보자 2. 지원자","examples":[{"en":"The candidate promised lower taxes.","ko":"그 후보자는 세금 인하를 약속했다."},{"en":"Each candidate must pass an interview.","ko":"각 지원자는 면접을 통과해야 한다."}]},{"en":"collaborate","ko":"협력하다, 공동으로 작업하다","examples":[{"en":"The two schools collaborate on a science project.","ko":"두 학교는 과학 프로젝트에서 협력한다."},{"en":"Writers often collaborate with artists.","ko":"작가들은 종종 화가들과 공동으로 작업한다."}]},{"en":"affection","ko":"1. 애착, 보살핌 2. 애정","examples":[{"en":"He showed deep affection for his dog.","ko":"그는 자신의 개에 대한 깊은 애착을 보였다."},{"en":"Grandparents give children love and affection.","ko":"조부모는 아이들에게 사랑과 애정을 준다."}]},{"en":"grab","ko":"1. 움켜쥐다, 붙잡다 2. (기회를) 잡다; 움켜잡음","examples":[{"en":"He grabbed her arm to stop her.","ko":"그는 그녀를 막으려고 그녀의 팔을 붙잡았다."},{"en":"Grab the chance while you can.","ko":"기회가 있을 때 그 기회를 잡아라."}]},{"en":"embed","ko":"1. 박다[끼워 넣다] 2. 깊이 새겨 두다","examples":[{"en":"The sensors are embedded in the road.","ko":"센서들이 도로에 박혀 있다."},{"en":"Good values are deeply embedded in the culture.","ko":"좋은 가치는 그 문화에 깊이 새겨져 있다."}]},{"en":"vomit","ko":"토하다, 게우다","examples":[{"en":"The child vomited after eating too much.","ko":"그 아이는 너무 많이 먹은 뒤 토했다."},{"en":"The smell made me want to vomit.","ko":"그 냄새 때문에 토하고 싶어졌다."}]},{"en":"figure","ko":"1. 숫자, 수치 2. 모습, 형상 3. 인물 4. 도표 5. 도형; 1. 계산하다 2. 판단하다","examples":[{"en":"The sales figure rose by ten percent.","ko":"매출 수치가 10퍼센트 올랐다."},{"en":"A tall figure appeared in the doorway.","ko":"키 큰 형체가 문가에 나타났다."}]},{"en":"mutual","ko":"1. 상호 간의 2. 서로의, 공동의","examples":[{"en":"They have a mutual respect for each other.","ko":"그들은 서로에 대한 상호 존중이 있다."},{"en":"We found we had a mutual friend.","ko":"우리는 공동의 친구가 있다는 것을 알게 되었다."}]},{"en":"refrain","ko":"삼가다, 자제하다","examples":[{"en":"Please refrain from smoking here.","ko":"이곳에서는 흡연을 삼가 주세요."},{"en":"He refrained from commenting on the rumor.","ko":"그는 그 소문에 대한 논평을 자제했다."}]},{"en":"basis","ko":"1. 근거, 이유 2. 기초, 토대","examples":[{"en":"There is no basis for these rumors.","ko":"이런 소문에는 근거가 없다."},{"en":"Trust is the basis of friendship.","ko":"신뢰는 우정의 토대이다."}]},{"en":"cosmetic","ko":"화장품; 화장용의, 미용의","examples":[{"en":"She bought some cosmetics at the store.","ko":"그녀는 가게에서 화장품을 샀다."},{"en":"The company makes cosmetic products from plants.","ko":"그 회사는 식물로 미용 제품을 만든다."}]},{"en":"squeeze","ko":"1. 짜내다 2. 꽉 쥐다 3. 압박하다","examples":[{"en":"Squeeze a lemon into the water.","ko":"물에 레몬을 짜 넣으세요."},{"en":"He squeezed my hand to comfort me.","ko":"그는 나를 위로하려고 내 손을 꽉 쥐었다."}]},{"en":"worthwhile","ko":"(~할) 가치가 있는","examples":[{"en":"The long trip was worthwhile.","ko":"그 긴 여행은 가치가 있었다."},{"en":"It is worthwhile to read this book.","ko":"이 책은 읽을 가치가 있다."}]},{"en":"pose","ko":"1. (문제를) 제기하다 2. 자세를 취하다; 자세","examples":[{"en":"The question poses a difficult problem.","ko":"그 질문은 어려운 문제를 제기한다."},{"en":"She posed for a photo in front of the tower.","ko":"그녀는 탑 앞에서 사진을 찍으려고 자세를 취했다."}]},{"en":"intake","ko":"섭취, 흡입","examples":[{"en":"Reduce your sugar intake for better health.","ko":"건강을 위해 설탕 섭취량을 줄여라."},{"en":"A sharp intake of breath told me she was surprised.","ko":"숨을 급히 들이마시는 소리에 나는 그녀가 놀랐음을 알았다."}]},{"en":"sequence","ko":"1. (일련의) 연속 2. 순서, 차례","examples":[{"en":"A sequence of events led to the accident.","ko":"일련의 사건들이 그 사고로 이어졌다."},{"en":"Follow the sequence of steps carefully.","ko":"단계의 순서를 주의 깊게 따르세요."}]},{"en":"drastic","ko":"급격한, 과감한, 극단적인","examples":[{"en":"The company took drastic measures to cut costs.","ko":"그 회사는 비용을 줄이기 위해 과감한 조치를 취했다."},{"en":"A drastic change in weather surprised everyone.","ko":"급격한 날씨 변화가 모두를 놀라게 했다."}]},{"en":"invade","ko":"1. 침략[침입]하다 2. 침해하다","examples":[{"en":"The army invaded the neighboring country.","ko":"군대는 이웃 나라를 침략했다."},{"en":"The media should not invade people's privacy.","ko":"언론은 사람들의 사생활을 침해해서는 안 된다."}]},{"en":"chronic","ko":"(질병이) 만성적인","examples":[{"en":"He suffers from chronic back pain.","ko":"그는 만성적인 허리 통증에 시달린다."},{"en":"Chronic diseases need long-term care.","ko":"만성 질환은 장기적인 관리가 필요하다."}]},{"en":"prejudice","ko":"편견; 편견을 갖게 하다","examples":[{"en":"We must fight prejudice against foreigners.","ko":"우리는 외국인에 대한 편견과 맞서 싸워야 한다."},{"en":"The story prejudiced him against the company.","ko":"그 이야기는 그가 그 회사에 대해 편견을 갖게 했다."}]},{"en":"norm","ko":"1. 표준, 기준 2. 규범","examples":[{"en":"Working from home has become the norm.","ko":"재택근무가 표준이 되었다."},{"en":"Every society has its own social norms.","ko":"모든 사회에는 나름의 사회 규범이 있다."}]},{"en":"superb","ko":"최고의, 훌륭한","examples":[{"en":"The chef prepared a superb dinner.","ko":"그 요리사는 최고의 저녁 식사를 준비했다."},{"en":"She gave a superb performance on stage.","ko":"그녀는 무대에서 훌륭한 공연을 펼쳤다."}]},{"en":"organism","ko":"유기체, (작은) 생물","examples":[{"en":"Bacteria are tiny living organisms.","ko":"세균은 아주 작은 살아 있는 생물이다."},{"en":"Every organism needs energy to survive.","ko":"모든 유기체는 생존을 위해 에너지가 필요하다."}]},{"en":"source","ko":"1. 원천, 근원 2. 자료, (자료의) 출처","examples":[{"en":"The sun is the source of energy for the Earth.","ko":"태양은 지구의 에너지원이다."},{"en":"Always check the source of your information.","ko":"정보의 출처를 항상 확인하라."}]},{"en":"emphasize","ko":"강조하다, 역설하다","examples":[{"en":"The teacher emphasized the importance of reading.","ko":"선생님은 독서의 중요성을 강조했다."},{"en":"He emphasized that safety comes first.","ko":"그는 안전이 최우선임을 역설했다."}]},{"en":"guilty","ko":"유죄의, 죄책감을 느끼는","examples":[{"en":"The jury found him guilty of theft.","ko":"배심원단은 그에게 절도 유죄 판결을 내렸다."},{"en":"I feel guilty about forgetting her birthday.","ko":"그녀의 생일을 잊어서 죄책감이 든다."}]},{"en":"terminal","ko":"1. 말기의, 불치의 2. 끝의; 터미널","examples":[{"en":"He has a terminal illness.","ko":"그는 불치병을 앓고 있다."},{"en":"Our bus leaves from the main terminal.","ko":"우리 버스는 중앙 터미널에서 출발한다."}]},{"en":"rid","ko":"1. 제거하다 2. 자유롭게 하다","examples":[{"en":"This medicine will rid you of your headache.","ko":"이 약은 네 두통을 없애 줄 것이다."},{"en":"The new law will rid the town of crime.","ko":"새 법은 그 마을을 범죄에서 벗어나게 할 것이다."}]},{"en":"raise","ko":"1. 올리다 2. 기르다 3. 모금하다 4. 제기하다; 임금 인상","examples":[{"en":"Please raise your hand if you know the answer.","ko":"답을 알면 손을 들어 주세요."},{"en":"They raised money for the flood victims.","ko":"그들은 수재민을 위해 모금했다."}]},{"en":"rise","ko":"1. 오르다, 상승하다 2. (해·달이) 뜨다; 1. 오름, 상승 2. 증가","examples":[{"en":"The sun rises in the east.","ko":"해는 동쪽에서 뜬다."},{"en":"Prices continue to rise every year.","ko":"물가는 해마다 계속 오른다."}]},{"en":"arise","ko":"발생하다, 생기다","examples":[{"en":"Problems may arise during the experiment.","ko":"실험 중에 문제가 생길 수 있다."},{"en":"A new question arose from the discussion.","ko":"토론에서 새로운 의문이 발생했다."}]}]},{"week":21,"words":[{"en":"document","ko":"문서, 서류; 기록하다","examples":[{"en":"Please sign this document.","ko":"이 서류에 서명해 주세요."},{"en":"The reporter documented the damage with photos.","ko":"그 기자는 피해 상황을 사진으로 기록했다."}]},{"en":"infer","ko":"추론하다, 추측하다","examples":[{"en":"We can infer his mood from his voice.","ko":"우리는 그의 목소리로 기분을 추론할 수 있다."},{"en":"What can you infer from these results?","ko":"이 결과에서 무엇을 추론할 수 있나요?"}]},{"en":"polar","ko":"1. 극지의, 북극[남극]의 2. (전지·자기의) 양극의","examples":[{"en":"Polar bears live in the Arctic.","ko":"북극곰은 북극에 산다."},{"en":"The polar ice is melting quickly.","ko":"극지방의 얼음이 빠르게 녹고 있다."}]},{"en":"esteem","ko":"존중, 존경; (중히) 여기다","examples":[{"en":"She is held in high esteem by her colleagues.","ko":"그녀는 동료들에게 높은 존경을 받는다."},{"en":"I esteem him for his honesty.","ko":"나는 그의 정직함 때문에 그를 존중한다."}]},{"en":"criticize","ko":"1. 비판[비난]하다 2. 비평하다","examples":[{"en":"Don't criticize others without knowing the facts.","ko":"사실을 알지 못한 채 남을 비판하지 마라."},{"en":"The critic criticized the film's weak ending.","ko":"그 평론가는 영화의 약한 결말을 비평했다."}]},{"en":"vow","ko":"맹세하다, 서약하다; 맹세, 서약","examples":[{"en":"He vowed never to lie again.","ko":"그는 다시는 거짓말을 하지 않겠다고 맹세했다."},{"en":"They took a vow of silence.","ko":"그들은 침묵의 서약을 했다."}]},{"en":"accelerate","ko":"속도를 높이다, 가속화되다[하다]","examples":[{"en":"The car accelerated down the road.","ko":"그 차는 도로를 따라 속도를 높였다."},{"en":"New technology will accelerate the process.","ko":"신기술은 그 과정을 가속화할 것이다."}]},{"en":"counterfeit","ko":"위조의, 가짜의; 위조품, 가짜","examples":[{"en":"Police found a lot of counterfeit money.","ko":"경찰은 많은 위조 지폐를 발견했다."},{"en":"This bag is a counterfeit, not the real one.","ko":"이 가방은 진품이 아니라 가짜다."}]},{"en":"negotiate","ko":"1. 협상[교섭]하다 2. 협정[결정]하다 3. 양도하다, 유통하다 4. 지나다, 빠져나가다","examples":[{"en":"The workers negotiated for higher pay.","ko":"노동자들은 더 높은 임금을 위해 협상했다."},{"en":"The two countries negotiated a peace treaty.","ko":"두 나라는 평화 조약을 협정했다."}]},{"en":"revolution","ko":"1. 혁명 2. 공전, 회전","examples":[{"en":"The French Revolution began in 1789.","ko":"프랑스 혁명은 1789년에 시작되었다."},{"en":"The Earth's revolution around the sun takes a year.","ko":"지구가 태양 주위를 공전하는 데는 1년이 걸린다."}]},{"en":"foretell","ko":"예언하다, 예고하다","examples":[{"en":"No one can foretell the future.","ko":"누구도 미래를 예언할 수 없다."},{"en":"The old woman claimed she could foretell storms.","ko":"그 노부인은 폭풍을 예고할 수 있다고 주장했다."}]},{"en":"rejoice","ko":"크게 기뻐하다","examples":[{"en":"The villagers rejoiced at the news of peace.","ko":"마을 사람들은 평화의 소식에 크게 기뻐했다."},{"en":"We rejoiced when our team won.","ko":"우리 팀이 이겼을 때 우리는 크게 기뻐했다."}]},{"en":"exquisite","ko":"1. 매우 아름다운 2. 정교한","examples":[{"en":"She wore an exquisite silk dress.","ko":"그녀는 매우 아름다운 비단 드레스를 입었다."},{"en":"The jeweler added exquisite details to the ring.","ko":"보석상은 반지에 정교한 세공을 더했다."}]},{"en":"discriminate","ko":"1. 차별하다 2. 구별하다, 식별하다","examples":[{"en":"It is illegal to discriminate against anyone because of race.","ko":"인종 때문에 누군가를 차별하는 것은 불법이다."},{"en":"Children can discriminate between different sounds early.","ko":"아이들은 일찍부터 서로 다른 소리를 구별할 수 있다."}]},{"en":"solitary","ko":"1. 혼자의 2. 고독한, 외로운","examples":[{"en":"A solitary tree stood in the field.","ko":"한 그루의 나무가 들판에 홀로 서 있었다."},{"en":"He lives a solitary life in the mountains.","ko":"그는 산속에서 고독한 삶을 산다."}]},{"en":"geology","ko":"지질학","examples":[{"en":"She studies geology to learn about rocks.","ko":"그녀는 암석을 알기 위해 지질학을 공부한다."},{"en":"Geology helps us predict earthquakes.","ko":"지질학은 지진을 예측하는 데 도움을 준다."}]},{"en":"predecessor","ko":"전임자, 이전의 것","examples":[{"en":"He was the predecessor of the current manager.","ko":"그는 현 매니저의 전임자였다."},{"en":"The new model is faster than its predecessor.","ko":"새 모델은 이전 모델보다 빠르다."}]},{"en":"masculine","ko":"남자의, 남자다운","examples":[{"en":"He has a deep, masculine voice.","ko":"그는 낮고 남자다운 목소리를 가졌다."},{"en":"The masculine form of the word is shown here.","ko":"여기에는 그 단어의 남성형이 나와 있다."}]},{"en":"equate","ko":"동일시하다, 균등하게 하다","examples":[{"en":"Don't equate money with happiness.","ko":"돈을 행복과 동일시하지 마라."},{"en":"Some people equate silence with agreement.","ko":"어떤 사람들은 침묵을 동의와 동일시한다."}]},{"en":"resume","ko":"재개하다, 다시 시작하다","examples":[{"en":"The meeting will resume after lunch.","ko":"회의는 점심 식사 후에 재개될 것이다."},{"en":"She resumed her studies after a break.","ko":"그녀는 휴식 후에 공부를 다시 시작했다."}]},{"en":"sector","ko":"부문, 분야, 영역","examples":[{"en":"The technology sector is growing fast.","ko":"기술 부문은 빠르게 성장하고 있다."},{"en":"He works in the public sector.","ko":"그는 공공 부문에서 일한다."}]},{"en":"wander","ko":"1. 배회하다, 방랑하다 2. 산만해지다","examples":[{"en":"We wandered through the old streets.","ko":"우리는 옛 거리를 이리저리 돌아다녔다."},{"en":"His mind wandered during the boring lecture.","ko":"지루한 강의 중에 그의 마음은 산만해졌다."}]},{"en":"layer","ko":"층, 겹; 층층이 쌓다","examples":[{"en":"The cake has three layers.","ko":"그 케이크는 3층으로 되어 있다."},{"en":"A thin layer of snow covered the road.","ko":"얇은 눈 층이 도로를 덮고 있었다."}]},{"en":"scheme","ko":"1. (운영) 계획, 제도 2. 책략; 1. 계획하다 2. 책략을 꾸미다","examples":[{"en":"The government started a new housing scheme.","ko":"정부는 새로운 주택 제도를 시작했다."},{"en":"He was caught in a scheme to cheat investors.","ko":"그는 투자자들을 속이려는 책략에 연루되어 붙잡혔다."}]},{"en":"academic","ko":"학업[학교]의, 학문의, 학구적인","examples":[{"en":"She has an excellent academic record.","ko":"그녀는 뛰어난 학업 성적을 가지고 있다."},{"en":"The school is known for academic excellence.","ko":"그 학교는 학문적 우수성으로 유명하다."}]},{"en":"impulse","ko":"1. 충동 2. 충격, 자극","examples":[{"en":"I bought it on impulse.","ko":"나는 충동적으로 그것을 샀다."},{"en":"Nerves send electrical impulses to the brain.","ko":"신경은 뇌로 전기 자극을 보낸다."}]},{"en":"evaluate","ko":"(가치·품질 등을) 평가하다, 감정하다","examples":[{"en":"Teachers evaluate students' progress each term.","ko":"교사들은 학기마다 학생들의 성취도를 평가한다."},{"en":"An expert evaluated the value of the painting.","ko":"전문가가 그 그림의 가치를 감정했다."}]},{"en":"restrict","ko":"제한[한정]하다","examples":[{"en":"The law restricts the use of plastic bags.","ko":"그 법은 비닐봉지 사용을 제한한다."},{"en":"Heavy snow restricted our movement.","ko":"폭설이 우리의 이동을 제한했다."}]},{"en":"verbal","ko":"1. 언어의, 말의 2. 구두의","examples":[{"en":"Verbal skills are important in a debate.","ko":"언어 능력은 토론에서 중요하다."},{"en":"He gave a verbal warning.","ko":"그는 구두로 경고했다."}]},{"en":"tenant","ko":"세입자, 임차인","examples":[{"en":"The tenant pays rent on the first of each month.","ko":"세입자는 매달 1일에 월세를 낸다."},{"en":"The landlord asked the tenants to leave.","ko":"집주인은 세입자들에게 나가 달라고 요청했다."}]},{"en":"surpass","ko":"능가하다, 뛰어넘다","examples":[{"en":"Her score surpassed all expectations.","ko":"그녀의 점수는 모든 기대를 뛰어넘었다."},{"en":"The student surpassed his teacher in chess.","ko":"그 학생은 체스에서 스승을 능가했다."}]},{"en":"anniversary","ko":"기념일","examples":[{"en":"They celebrated their tenth wedding anniversary.","ko":"그들은 결혼 10주년 기념일을 축하했다."},{"en":"Today is the school's fiftieth anniversary.","ko":"오늘은 학교 창립 50주년 기념일이다."}]},{"en":"fragile","ko":"1. 부서지기[깨지기] 쉬운 2. 연약한, 허약한 3. 섬세한","examples":[{"en":"Be careful; the glass is fragile.","ko":"조심해, 그 유리는 깨지기 쉬워."},{"en":"The peace in the region is still fragile.","ko":"그 지역의 평화는 아직 연약하다."}]},{"en":"muscle","ko":"근육, 힘","examples":[{"en":"Exercise builds strong muscles.","ko":"운동은 튼튼한 근육을 만든다."},{"en":"He has strong arm muscles.","ko":"그는 팔 근육이 튼튼하다."}]},{"en":"distract","ko":"(주의를) 딴 데로 돌리다, 산만하게 하다","examples":[{"en":"Noise can distract students from studying.","ko":"소음은 학생들이 공부에 집중하지 못하게 주의를 딴 데로 돌릴 수 있다."},{"en":"Don't distract the driver while he is driving.","ko":"운전 중인 운전자의 주의를 산만하게 하지 마라."}]},{"en":"district","ko":"지구, 구역","examples":[{"en":"The school district built a new library.","ko":"그 학군은 새 도서관을 지었다."},{"en":"He lives in the business district.","ko":"그는 상업 지구에 산다."}]},{"en":"proceed","ko":"1. 진행하다, 계속되다 2. 나아가다","examples":[{"en":"The project will proceed as planned.","ko":"그 프로젝트는 계획대로 진행될 것이다."},{"en":"Please proceed to gate 12.","ko":"12번 게이트로 가 주세요."}]},{"en":"precede","ko":"~에 선행하다, ~에 앞서다","examples":[{"en":"A short speech preceded the dinner.","ko":"짧은 연설이 저녁 식사에 앞섰다."},{"en":"Thunder often precedes heavy rain.","ko":"천둥은 종종 폭우에 선행한다."}]}]}];
let currentWeek=15, memItems=[], memIndex=0, quizItems=[], quizIndex=0, score=0, answered=false, quizMode='enko', quizScope='week', lastScope='week';
const $=id=>document.getElementById(id);
function escapeHTML(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
const allWords=()=>DATA.flatMap(w=>w.words.map(x=>({...x,week:w.week})));
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
function goHome(){show('home');renderHome();}
function renderHome(){
 const total=allWords().length;$('totalWords').textContent=total;
 let done=0;try{done=Object.keys(JSON.parse(localStorage.getItem('vocabScores')||'{}')).length}catch(e){}
 $('doneCount').textContent=done;
 $('weeks').innerHTML=DATA.map(w=>{let p=0;try{p=JSON.parse(localStorage.getItem('vocabProgress')||'{}')[w.week]||0}catch(e){}
 return `<article class="week"><div class="weekhead"><h3>WEEK ${w.week}</h3><span class="count">${w.words.length} words</span></div><div class="bar"><i style="width:${p}%"></i></div><div class="actions"><button class="btn" onclick="openMem(${w.week})">📖 암기하기</button><button class="btn primary" onclick="openMode(${w.week})">✍ 테스트</button></div></article>`}).join('');
}
function getWeek(w){return DATA.find(x=>x.week===w)}
function openMem(w){currentWeek=w;memItems=getWeek(w).words;memIndex=0;showMem();show('memorize')}
function showMem(){let item=memItems[memIndex];$('memWeek').textContent='WEEK '+currentWeek;$('memCount').textContent=`${memIndex+1} / ${memItems.length}`;$('memBar').style.width=((memIndex+1)/memItems.length*100)+'%';$('memWord').textContent=item.en;$('memMeaning').textContent=item.ko;
 const examples=item.examples||[];
 $('ex1').innerHTML=examples[0]?`<b>1.</b> ${escapeHTML(examples[0].en)}<div class="translation">${escapeHTML(examples[0].ko)}</div>`:'';
 $('ex2').innerHTML=examples[1]?`<b>2.</b> ${escapeHTML(examples[1].en)}<div class="translation">${escapeHTML(examples[1].ko)}</div>`:'';
}
function moveMem(d){let n=memIndex+d;if(n<0||n>=memItems.length)return;memIndex=n;showMem()}
function showWordList(){$('listTitle').textContent='WEEK '+currentWeek+' 단어 목록';$('listCount').textContent=memItems.length+' words';$('wordList').innerHTML=memItems.map((x,i)=>`<button class="mode" onclick="memIndex=${i};showMem();show('memorize')"><strong>${i+1}. ${x.en}</strong><span>${x.ko}</span></button>`).join('');show('list')}
function openMode(w){currentWeek=w;quizScope='week';$('modeWeek').textContent='WEEK '+w;show('mode')}
function chooseTest(scope){quizScope=scope;currentWeek=scope==='all'?0:scope;quizMode='enko';startQuiz('enko')}
function startQuiz(mode){quizMode=mode;lastScope=quizScope;let src=quizScope==='all'?allWords():getWeek(currentWeek).words.map(x=>({...x,week:currentWeek}));quizItems=shuffle(src);quizIndex=0;score=0;answered=false;$('quizWeek').textContent=quizScope==='all'?'WEEK 15–21':'WEEK '+currentWeek;$('quizTitle').textContent=quizScope==='all'?'최종 종합 테스트':'주차별 단어 테스트';show('quiz');renderQuestion()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function renderQuestion(){let item=quizItems[quizIndex];answered=false;$('quizCount').textContent=`${quizIndex+1} / ${quizItems.length}`;$('quizBar').style.width=(quizIndex/quizItems.length*100)+'%';$('qhint').textContent=quizMode==='enko'?'다음 단어의 뜻을 고르세요.':'다음 뜻에 해당하는 영어 단어를 직접 입력하세요.';$('question').textContent=quizMode==='enko'?item.en:item.ko;
 if(quizMode==='koen'){
  $('options').innerHTML=`<div class="typed-wrap"><input id="typedAnswer" class="typed-input" type="text" placeholder="영어 단어를 입력하세요" autocomplete="off" autocapitalize="none" spellcheck="false"><button class="typed-submit" id="checkTyped" onclick="checkTypedAnswer()">정답 확인</button></div>`;
  $('typedAnswer').addEventListener('keydown',e=>{if(e.key==='Enter')checkTypedAnswer()});
  setTimeout(()=>$('typedAnswer')?.focus(),50);
 }else{
  let opts=[item,...shuffle(quizItems.filter(x=>x.en!==item.en)).slice(0,3)];opts=shuffle(opts);$('options').innerHTML=opts.map(o=>`<button class="option" data-answer="${encodeURIComponent(o.en)}" onclick="selectAnswer(this,'${encodeURIComponent(item.en)}')">${o.ko}</button>`).join('');
 }
 $('feedback').textContent='';$('feedback').className='feedback';$('nextQ').disabled=true;$('nextQ').textContent=quizIndex===quizItems.length-1?'결과 보기':'다음 문제 →';$('scoreLive').textContent=`정답 ${score}개`}
function gradeAnswer(chosen,right){if(answered)return;answered=true;let isCorrect=chosen.trim().toLowerCase()===right.trim().toLowerCase();if(isCorrect){score++;$('feedback').textContent='정답입니다!';$('feedback').classList.add('ok')}else{$('feedback').textContent=`아쉬워요. 정답은 ${right}입니다.`;$('feedback').classList.add('no')}$('scoreLive').textContent=`정답 ${score}개`;$('nextQ').disabled=false;return isCorrect}
function checkTypedAnswer(){if(answered)return;let input=$('typedAnswer');let chosen=input.value.trim();if(!chosen){$('feedback').textContent='영어 단어를 입력해 주세요.';return}gradeAnswer(chosen,quizItems[quizIndex].en);input.disabled=true;$('checkTyped').disabled=true}
function selectAnswer(btn,correct){if(answered)return;let chosen=decodeURIComponent(btn.dataset.answer),right=decodeURIComponent(correct);document.querySelectorAll('.option').forEach(b=>{b.disabled=true;let v=decodeURIComponent(b.dataset.answer);if(v===right)b.classList.add('correct')});gradeAnswer(chosen,right);if(chosen!==right)btn.classList.add('wrong')}
function nextQuestion(){if(!answered)return;if(++quizIndex<quizItems.length)renderQuestion();else finishQuiz()}
function finishQuiz(){show('result');let pct=Math.round(score/quizItems.length*100);$('scoreFinal').textContent=`${score} / ${quizItems.length}`;$('resultText').textContent=`정답률 ${pct}% · ${pct>=90?'훌륭해요!':pct>=70?'좋은 결과예요. 조금만 더 복습해 보세요.':'틀린 단어를 다시 암기해 보세요.'}`;
 let key=quizScope==='all'?'FINAL':String(currentWeek);let scores={};try{scores=JSON.parse(localStorage.getItem('vocabScores')||'{}')}catch(e){}scores[key]={score,total:quizItems.length,pct};localStorage.setItem('vocabScores',JSON.stringify(scores));if(quizScope!=='all'){let p={};try{p=JSON.parse(localStorage.getItem('vocabProgress')||'{}')}catch(e){}p[currentWeek]=Math.max(p[currentWeek]||0,pct);localStorage.setItem('vocabProgress',JSON.stringify(p))}}
function retryQuiz(){quizScope=lastScope;startQuiz(quizMode)}
function showMemAndReturn(){showMem();show('memorize')}
renderHome();
</script></body></html>
